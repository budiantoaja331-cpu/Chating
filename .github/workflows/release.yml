name: Android Release Build

on:
  push:
    tags:
      - 'v*' # Workflow akan berjalan ketika Anda men-push tag seperti v1.0.0
  workflow_dispatch: # Mengizinkan untuk memicu build secara manual dari UI GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Mengubah string base64 dari GitHub Secrets kembali menjadi file .jks
          echo $KEYSTORE_BASE64 | base64 --decode > $GITHUB_WORKSPACE/release-keystore.jks

      - name: Build Release AAB (Android App Bundle)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Gunakan gradle, bukan gradlew karena di lingkungan ini kita menggunakan gradle murni
        run: gradle :app:bundleRelease

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
