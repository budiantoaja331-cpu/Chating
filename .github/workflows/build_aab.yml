name: Build & Sign Android App Bundle (AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore from Base64
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_CONTENT" ]; then
            echo "Error: KEYSTORE_FILE secret tidak ditemukan!"
            exit 1
          fi
          echo "$KEYSTORE_CONTENT" | base64 -d > app/release.keystore
          echo "✅ Keystore berhasil didecode ke app/release.keystore"

      - name: Prepare Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Menggunakan google-services.json dari GitHub Secrets..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "Menggunakan app/google-services.json yang sudah ada di repositori..."
          else
            echo "Error: google-services.json tidak ditemukan!"
            exit 1
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - name: Sign AAB Bundle with jarsigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: AAB file tidak ditemukan!"
            ls -la app/build/outputs/bundle/release/
            exit 1
          fi
          
          echo "📝 Menandatangani: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" "$KEY_ALIAS"

      - name: Verify AAB Signature
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "✅ Verifying signature..."
          jarsigner -verify -verbose "$AAB_FILE"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatmicall-release-signed
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Create Release Notes
        run: |
          echo "# 🎉 ChatMicAll Release" > release_notes.md
          echo "- Build Date: $(date)" >> release_notes.md
          echo "- Commit: ${{ github.sha }}" >> release_notes.md
          echo "- Branch: ${{ github.ref }}" >> release_notes.md
          cat release_notes.md
