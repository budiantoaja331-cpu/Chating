name: Build & Sign Android App Bundle (AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "Keystore Secrets belum diatur, membuat keystore otomatis untuk penandatanganan AAB..."
            keytool -genkey -v -keystore app/release.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ChatMicAll,O=App,C=ID"
          fi

      - name: Prepare Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Menggunakan google-services.json dari GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Menyiapkan google-services.json standar..."
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789012",
                "project_id": "chatmicall-app",
                "storage_bucket": "chatmicall-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                    "android_client_info": {
                      "package_name": "com.chatmicall.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyDummyKeyForBuildVerification123"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Build Android App Bundle (AAB)
        run: gradle :app:bundleRelease --no-daemon

      - name: Sign AAB Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Penandatanganan AAB menggunakan Production Keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS"
          else
            echo "Penandatanganan AAB menggunakan Auto Keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/release.keystore \
              -storepass android \
              -keypass android \
              "$AAB_FILE" androiddebugkey
          fi

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatmicall-release-signed
          path: app/build/outputs/bundle/release/*.aab

